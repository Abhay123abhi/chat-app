name: Chat checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: chat-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: bash ./mvnw -B verify
        working-directory: chat-app-backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: chat-app-frontend/package-lock.json
      - run: npm ci
        working-directory: chat-app-frontend
      - run: npm run lint -- --max-warnings=0
        working-directory: chat-app-frontend
      - name: Enforce production dependency security
        run: npm audit --omit=dev --audit-level=high
        working-directory: chat-app-frontend
      - run: npm test
        working-directory: chat-app-frontend
      - run: npm run build
        working-directory: chat-app-frontend
      - name: SPA /chat route works with Vite proxy
        working-directory: chat-app-frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/chat-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/chat -o /tmp/chat-vite-route.html; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          grep -q '<div id="root"></div>' /tmp/chat-vite-route.html

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/rooms/ci-room || true)
            if [[ "$status" == "404" || "$status" == "200" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          # Deep links to the React /chat page must return HTML, not a WebSocket upgrade error.
          curl -fsS http://localhost:3000/chat -o /tmp/chat-nginx-route.html
          grep -q '<div id="root"></div>' /tmp/chat-nginx-route.html
          curl -fsS -H 'Content-Type: text/plain' --data 'ci-room' http://localhost:3000/api/v1/rooms
          saved=$(curl -fsS -H 'Content-Type: application/json' \
            --data '{"clientMessageId":"ci-1","sender":"CI","content":"hello"}' \
            http://localhost:3000/api/v1/rooms/ci-room/messages)
          echo "$saved" | grep -q '"content":"hello"'
          history=$(curl -fsS 'http://localhost:3000/api/v1/rooms/ci-room/messages?limit=10')
          echo "$history" | grep -q '"clientMessageId":"ci-1"'
      - name: Native WebSocket / STOMP smoke test
        run: node .github/scripts/stomp-smoke.mjs
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
