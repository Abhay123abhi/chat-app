name: Chat checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: chat-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: bash ./mvnw -B verify
        working-directory: chat-app-backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: chat-app-frontend/package-lock.json
      - run: npm ci
        working-directory: chat-app-frontend
      - run: npm run lint -- --max-warnings=0
        working-directory: chat-app-frontend
      - name: Report production dependency advisories
        working-directory: chat-app-frontend
        run: |
          npm audit --omit=dev --json > npm-audit-runtime.json || true
          node -e 'const r = require("./npm-audit-runtime.json"); console.log("Runtime vulnerabilities:", JSON.stringify(r.metadata?.vulnerabilities)); for (const [name, v] of Object.entries(r.vulnerabilities || {})) console.log(name, v.severity, v.range, JSON.stringify(v.fixAvailable));'
      - run: npm test
        working-directory: chat-app-frontend
      - run: npm run build
        working-directory: chat-app-frontend

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/chat/info >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl -fsS -H 'Content-Type: text/plain' --data 'ci-room' http://localhost:3000/api/v1/rooms
          saved=$(curl -fsS -H 'Content-Type: application/json' \
            --data '{"clientMessageId":"ci-1","sender":"CI","content":"hello"}' \
            http://localhost:3000/api/v1/rooms/ci-room/messages)
          echo "$saved" | grep -q '"content":"hello"'
          history=$(curl -fsS 'http://localhost:3000/api/v1/rooms/ci-room/messages?limit=10')
          echo "$history" | grep -q '"clientMessageId":"ci-1"'
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
