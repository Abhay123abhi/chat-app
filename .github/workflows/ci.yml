name: Chat checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: bash ./mvnw -B verify
        working-directory: chat-app-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chat-app-frontend/package-lock.json
      - run: npm ci
        working-directory: chat-app-frontend
      - run: node --test src/services/messageState.test.js
        working-directory: chat-app-frontend
      - run: npm run build
        working-directory: chat-app-frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Smoke test
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -H 'Content-Type: text/plain' --data 'ci-room' http://localhost:3000/api/v1/rooms; then
              break
            fi
            sleep 2
          done
          curl -fsS -H 'Content-Type: application/json' \
            --data '{"clientMessageId":"ci-1","sender":"CI","content":"hello"}' \
            http://localhost:3000/api/v1/rooms/ci-room/messages
          curl -fsS 'http://localhost:3000/api/v1/rooms/ci-room/messages?limit=10'
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
