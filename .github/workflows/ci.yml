name: Chat checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: chat-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# CI needs read access only; no workflow writes to the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chat-app-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile, run tests and verify backend
        run: bash ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chat-app-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: chat-app-frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      # ESLint reports warnings but exits nonzero only for actual errors.
      # Do not use --max-warnings=0 or continue-on-error (which hides errors).
      - name: Lint (warnings are informational)
        run: npm run lint
      - name: Run frontend unit tests
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: SPA /chat route works with Vite proxy
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --strictPort > /tmp/chat-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/chat -o /tmp/chat-vite-route.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]] || ! grep -q '<div id="root"></div>' /tmp/chat-vite-route.html; then
            cat /tmp/chat-vite.log
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chat-app-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # npm audit reads the committed lockfile; high/critical production
      # vulnerabilities remain blocking, while lower severity advisories don't.
      - name: Audit production dependencies (high+ only)
        run: npm audit --omit=dev --audit-level=high

  public-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build optional single-service public demo image
        run: docker build -f Dockerfile.public -t room-chat-public:ci .

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      # Starting frontend includes its backend and MongoDB dependencies.
      # The Mongo Express admin UI is not needed for integration testing.
      - name: Build and start application
        run: docker compose up --build -d frontend
      - name: REST API and SPA route smoke tests
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/rooms/ci-room || true)
            if [[ "$status" == "404" || "$status" == "200" ]]; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          # The React /chat route must return the SPA, not a WebSocket error.
          curl -fsS http://localhost:3000/chat -o /tmp/chat-nginx-route.html
          grep -q '<div id="root"></div>' /tmp/chat-nginx-route.html
          curl -fsS -H 'Content-Type: text/plain' --data 'ci-room' http://localhost:3000/api/v1/rooms
          saved=$(curl -fsS -H 'Content-Type: application/json' \
            --data '{"clientMessageId":"ci-1","sender":"CI","content":"hello"}' \
            http://localhost:3000/api/v1/rooms/ci-room/messages)
          echo "$saved" | grep -q '"content":"hello"'
          history=$(curl -fsS 'http://localhost:3000/api/v1/rooms/ci-room/messages?limit=10')
          echo "$history" | grep -q '"clientMessageId":"ci-1"'
      - name: Native WebSocket / STOMP smoke test
        run: node .github/scripts/stomp-smoke.mjs
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100 frontend backend mongo
      - name: Stop test services
        if: always()
        run: docker compose down
