name: PR3 npm lockfile refresh (temporary)

on:
  push:
    branches: [chore/pr3-dependency-security-20261024]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve dependencies and commit the regenerated lockfile
        working-directory: chat-app-frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-app-frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate npm lockfile for security updates"
            git push origin HEAD:chore/pr3-dependency-security-20261024
          fi
