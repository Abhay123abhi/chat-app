name: PR7 compatible npm refresh (temporary)

on:
  push:
    branches: [chore/pr7-frontend-deps-unused-code]

permissions:
  contents: write

jobs:
  npm-compatible-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Update packages inside declared semver ranges
        working-directory: chat-app-frontend
        run: npm update --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chat-app-frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh compatible npm lockfile versions"
            git push origin HEAD:chore/pr7-frontend-deps-unused-code
          fi
