spring.application.name=chat-app-backend
server.port=${PORT:8080}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/chatapp?w=majority&journal=true}
spring.data.mongodb.auto-index-creation=true
server.error.include-message=always
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:40}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:4}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:100}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:50}
server.max-http-request-header-size=16KB
server.compression.enabled=true

chat.enabled=${CHAT_ENABLED:true}
chat.room-creation-enabled=${ROOM_CREATION_ENABLED:true}
chat.request-rate-limit-per-minute=${REQUEST_RATE_LIMIT_PER_MINUTE:120}
chat.global-request-rate-limit-per-minute=${GLOBAL_REQUEST_RATE_LIMIT_PER_MINUTE:600}
chat.message-rate-limit-per-minute=${MESSAGE_RATE_LIMIT_PER_MINUTE:30}
chat.global-message-rate-limit-per-minute=${GLOBAL_MESSAGE_RATE_LIMIT_PER_MINUTE:300}
chat.message-burst-limit=${MESSAGE_BURST_LIMIT:5}
chat.message-burst-window-seconds=${MESSAGE_BURST_WINDOW_SECONDS:5}
chat.room-creation-rate-limit-per-hour=${ROOM_CREATION_RATE_LIMIT_PER_HOUR:5}
chat.global-room-creation-rate-limit-per-hour=${GLOBAL_ROOM_CREATION_RATE_LIMIT_PER_HOUR:30}
chat.max-message-length=${MAX_MESSAGE_LENGTH:4000}
chat.max-messages-per-room=${MAX_MESSAGES_PER_ROOM:2000}
chat.max-active-rooms=${MAX_ACTIVE_ROOMS:100}
chat.max-active-users-per-room=${MAX_ACTIVE_USERS_PER_ROOM:20}
chat.max-presence-members-per-room=${MAX_PRESENCE_MEMBERS_PER_ROOM:50}
chat.max-websocket-connections-per-ip=${MAX_WEBSOCKET_CONNECTIONS_PER_IP:5}
chat.max-websocket-connections-per-room=${MAX_WEBSOCKET_CONNECTIONS_PER_ROOM:25}
chat.max-websocket-connections-global=${MAX_WEBSOCKET_CONNECTIONS_GLOBAL:80}
chat.message-retention-days=${MESSAGE_RETENTION_DAYS:7}
chat.room-inactivity-days=${ROOM_INACTIVITY_DAYS:7}
chat.default-history-page-size=${DEFAULT_HISTORY_PAGE_SIZE:50}
chat.max-history-page-size=${MAX_HISTORY_PAGE_SIZE:100}
chat.trusted-client-ip-header=${TRUSTED_CLIENT_IP_HEADER:CF-Connecting-IP}
