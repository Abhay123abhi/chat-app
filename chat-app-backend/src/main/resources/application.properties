spring.application.name=chat-app-backend
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/chatapp?w=majority&journal=true}
spring.data.mongodb.auto-index-creation=true
server.error.include-message=always
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Public-demo guardrails. Override these with server environment variables.
chat.enabled=${CHAT_ENABLED:true}
chat.room-creation-enabled=${ROOM_CREATION_ENABLED:true}
chat.message-rate-limit-per-minute=${MESSAGE_RATE_LIMIT_PER_MINUTE:30}
chat.message-burst-limit=${MESSAGE_BURST_LIMIT:5}
chat.message-burst-window-seconds=${MESSAGE_BURST_WINDOW_SECONDS:5}
chat.room-creation-rate-limit-per-hour=${ROOM_CREATION_RATE_LIMIT_PER_HOUR:5}
chat.max-message-length=${MAX_MESSAGE_LENGTH:4000}
chat.max-messages-per-room=${MAX_MESSAGES_PER_ROOM:2000}
chat.max-active-users-per-room=${MAX_ACTIVE_USERS_PER_ROOM:20}
chat.max-websocket-connections-per-ip=${MAX_WEBSOCKET_CONNECTIONS_PER_IP:5}
chat.message-retention-days=${MESSAGE_RETENTION_DAYS:7}
chat.room-inactivity-days=${ROOM_INACTIVITY_DAYS:7}
chat.global-request-rate-limit-per-minute=${GLOBAL_REQUEST_RATE_LIMIT_PER_MINUTE:120}
chat.default-history-page-size=${DEFAULT_HISTORY_PAGE_SIZE:50}
chat.max-history-page-size=${MAX_HISTORY_PAGE_SIZE:100}
