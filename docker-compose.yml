services:
  frontend:
    build: ./chat-app-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
  backend:
    build: ./chat-app-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/chat-app?w=majority&journal=true
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongo-data:
